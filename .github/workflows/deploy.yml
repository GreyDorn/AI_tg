name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            export APP_DIR="${{ secrets.DEPLOY_APP_DIR || '/root/tg_AI' }}"
            export SERVICE_NAME="${{ secrets.DEPLOY_SERVICE_NAME || 'tg_ai_bot.service' }}"
            bash "$APP_DIR/scripts/server-auto-deploy.sh"
            bash "$APP_DIR/scripts/server-health-check.sh"
            bash "$APP_DIR/scripts/ensure-de-max-webhook-proxy.sh"
            systemctl is-active llm_gateway.service || journalctl -u llm_gateway.service -n 50 --no-pager || true
